<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 120 775 520" role="img" aria-labelledby="logo-title">
  <title id="logo-title">ADAM — #houseofasher</title>
  <defs>
    <style>
      .shell {
        fill: #0b1320cc;
        stroke: #4a8cbb;
        stroke-width: 10px;
        stroke-linejoin: miter;
      }

      .apex {
        fill: none;
        stroke: #00d4ff;
        stroke-width: 22px;
        stroke-linejoin: miter;
        stroke-linecap: square;
      }

      .iris {
        fill: #00d4ff;
        fill-opacity: 0.16;
        stroke: #00d4ff;
        stroke-width: 9px;
      }

      .pupil {
        fill: #00d4ff;
      }

      .reticle {
        fill: none;
        stroke: #e6f7ff;
        stroke-width: 5px;
        stroke-linecap: square;
        opacity: 0.63;
      }
    </style>
  </defs>
  <!-- Outer shell: a hard-edged delta, the instrument housing. -->
  <path id="outer_eye" class="shell" d="M567,130 L925,630 L209,630 Z" />
  <!-- The "A": two struts and a crossbar, drawn as one precise stroke. -->
  <path id="inner_eye" class="apex" d="M404,600 L567,236 L730,600 M470,468 L664,468" />
  <!-- Scope ring and pupil move with the pointer (see src/logoGaze.js). -->
  <g id="globe">
    <circle class="iris" cx="567" cy="418" r="74" />
    <circle class="pupil" cx="567" cy="418" r="22" />
  </g>
  <path id="globe_cage" class="reticle" d="M567,320 V358 M567,478 V516 M469,418 H507 M627,418 H665" />
</svg>
